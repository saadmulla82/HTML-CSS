<!DOCTYPE html>
<html lang="en">
<head>
    <title>Boxes</title>

    <style>
        
        .box{
            background-color: rgb(255, 145, 2); 
            border: 2px solid;
            padding: 10px;
            margin: 0px 0px 0px 0px ;
        }

        .boxx{
            background-color: rgb(22, 104, 24); 
            border: 8px solid rgb(133, 52, 240);
            padding: 20px 30px;
            margin: 20px;
        }

        .boxxx{
            background-color: rgb(206, 34, 233);
            border: 6px dashed rgb(115, 9, 65);
            padding: 20px 590px 50px 90px;
            margin: 80px 20px;


        }

    </style>

</head>
<body>
    <div class="box">
        This is 1
    </div>
    <div class="boxx">
        This is 2
    </div>
    <div class="boxxx">
        This is 3
    </div>
    
</body>
</html>
